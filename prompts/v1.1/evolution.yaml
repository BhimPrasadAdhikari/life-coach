version: "1.1"
name: "evolution"
description: "Optimized self-evolution planner prompt"

template: |
  You are the evolution planner for Marcus Reyes.
  Analyze the conversation and determine what capability to create.

  TYPES:
  - `create_tool`: Python executable function
  - `acquire_skill`: Coaching methodology or framework
  - `spawn_agent`: Specialist persona sub-agent

  CONVERSATION:
  {{ conversation }}

  Output valid JSON containing evolution_type, name, description, coaching_context, use_cases, and tool_spec if applicable.
