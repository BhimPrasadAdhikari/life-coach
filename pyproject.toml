[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marcus-agent"
version = "0.1.0"
description = "Production-grade multi-channel autonomous coaching agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "qdrant-client>=1.9.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary,pool]>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-groq>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
